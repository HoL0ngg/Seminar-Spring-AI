spring:
  application:
    name: spring-ai-rag-chat
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:xxx}
      chat:
        base-url: https://openrouter.ai/api
        options:
          model: ${OPENAI_CHAT_MODEL:openrouter/free}
          temperature: 0.3
      embedding:
        options:
          model: text-embedding-ada-002
  datasource:
    url: jdbc:h2:mem:chatdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8082

logging:
  level:
    org.springframework.ai: DEBUG
    com.example: DEBUG
    org.springframework.web.socket: DEBUG
