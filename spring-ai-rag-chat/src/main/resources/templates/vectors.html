<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Store - TechCorp AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .vector-card { border: 0; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .embedding { font-family: monospace; font-size: .82rem; word-break: break-word; }
        .content-preview { white-space: pre-wrap; max-height: 180px; overflow-y: auto; }
        .metadata-key { color: #6f42c1; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="fas fa-robot me-2"></i>TechCorp AI Assistant</a>
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" href="/chat">Chat</a>
            <a class="nav-link active" href="/vectors">Vector Store</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1"><i class="fas fa-database text-primary me-2"></i>Vector Store</h1>
            <p class="text-muted mb-0">Các chunk đã được tách và embedding trong bộ nhớ.</p>
        </div>
        <button class="btn btn-outline-primary" onclick="loadVectors()">
            <i class="fas fa-sync-alt me-1"></i>Làm mới
        </button>
    </div>

    <div class="alert alert-info">
        <strong id="vector-count" th:text="${vectorCount}">0</strong> vector đang được lưu.
        Mỗi dòng hiển thị 12 giá trị đầu để dễ hình dung; toàn bộ vector vẫn được dùng khi tìm kiếm.
    </div>

    <div id="status" class="text-muted mb-3">Đang tải...</div>
    <div id="vectors" class="row g-3"></div>
</main>

<script>
    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, character => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[character]));
    }

    async function loadVectors() {
        const status = document.getElementById('status');
        const container = document.getElementById('vectors');
        status.textContent = 'Đang tải...';
        try {
            const response = await fetch('/api/vectors');
            if (!response.ok) throw new Error('Không thể tải vector store');
            const vectors = await response.json();
            document.getElementById('vector-count').textContent = vectors.length;
            container.innerHTML = vectors.length ? vectors.map((vector, index) => `
                <div class="col-12">
                    <div class="card vector-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between mb-2">
                                <h2 class="h6 mb-0">Vector #${index + 1}</h2>
                                <span class="badge bg-primary">${vector.dimensions} dimensions</span>
                            </div>
                            <div class="content-preview border rounded p-2 mb-3">${escapeHtml(vector.content)}</div>
                            <div class="mb-2">
                                <strong>Metadata</strong>
                                <span class="ms-2" id="metadata-${index}"></span>
                            </div>
                            <div>
                                <strong>Embedding preview</strong>
                                <div class="embedding text-muted mt-1">[${vector.embeddingPreview.map(value => value.toFixed(6)).join(', ')}${vector.dimensions > vector.embeddingPreview.length ? ', ...' : ''}]</div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('') : '<div class="col-12"><div class="alert alert-secondary">Chưa có vector. Hãy nạp knowledge base hoặc upload tài liệu từ trang chat.</div></div>';
            vectors.forEach((vector, index) => {
                document.getElementById(`metadata-${index}`).innerHTML = Object.entries(vector.metadata)
                    .map(([key, value]) => `<span class="badge bg-light text-dark me-1"><span class="metadata-key">${escapeHtml(key)}</span>: ${escapeHtml(value)}</span>`)
                    .join('') || '<span class="text-muted">Không có</span>';
            });
            status.textContent = `Đã tải ${vectors.length} vector.`;
        } catch (error) {
            status.textContent = error.message;
            container.innerHTML = '<div class="col-12"><div class="alert alert-danger">Không thể đọc vector store.</div></div>';
        }
    }

    loadVectors();
</script>
</body>
</html>
